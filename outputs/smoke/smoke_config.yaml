seed: 42
device: cpu
data:
  train_path: D:\桌面\Agent监测\FD-LLM\outputs\smoke\train.npz
  test_path: D:\桌面\Agent监测\FD-LLM\outputs\smoke\test.npz
  descriptions_path: D:\桌面\Agent监测\FD-LLM\data\datasets\CWRU\processed\class_descriptions.json
  num_classes: 19
  validation_fraction: 0.5
  num_workers: 0
model:
  name_or_path: D:\桌面\Agent监测\FD-LLM\outputs\smoke\tiny_random_llama
  revision: main
  local_files_only: true
  dtype: float32
data_encoder:
  input_size: 1
  sequence_length: 1024
  hidden_size: 8
  num_layers: 1
  embedding_dim: 16
  dropout: 0.1
  bidirectional: false
text_encoder:
  pooling: mean
  max_length: 256
contrastive:
  temperature: 0.07
  epsilon: 1.0e-06
  learn_temperature: false
alignment:
  epochs: 1
  batch_size: 19
  text_batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  output_dir: D:\桌面\Agent监测\FD-LLM\outputs\smoke\alignment
diagnosis:
  alignment_checkpoint: D:\桌面\Agent监测\FD-LLM\outputs\smoke\alignment\best.pt
  epochs: 1
  batch_size: 19
  learning_rate: 0.0002
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  output_dir: D:\桌面\Agent监测\FD-LLM\outputs\smoke\diagnosis
prompt:
  num_tokens: 3
  init_std: 0.02
  human_prefix: '### Human: <Data>'
  data_suffix: </Data>
  fuzzy_prefix: <Fuzzy semantic>
  assistant_suffix: '</Fuzzy semantic> What is the state of this bearing? ### Assistant:'
  answer_template: ' The bearing state is {class_name}.'
  max_answer_tokens: 96
lora:
  r: 2
  lora_alpha: 4
  lora_dropout: 0.0
  target_modules:
  - q_proj
  - v_proj
evaluation:
  batch_size: 4
  candidate_chunk_size: 4
  max_new_tokens: 96
  output_dir: D:\桌面\Agent监测\FD-LLM\outputs\smoke\evaluation
  tsne_perplexity: 30
  tsne_max_samples: 1000
